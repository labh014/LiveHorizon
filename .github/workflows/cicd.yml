name: Node.js CI and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    # --- Your old steps (they are good) ---
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: 1. Install Dependencies
      run: npm ci
      working-directory: ./backend

    - name: 2. Run Build
      run: npm run build --if-present
      working-directory: ./backend

    # --- THE CRITICAL FIX (Step 3 & 4) ---

    - name: 3. Create .env file
      # This step creates the .env file in the temporary folder
      # It uses the GitHub Secret you made in Phase 3
      run: |
        echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env
      working-directory: ./backend

    - name: 4. Restart PM2 Application
      # This step tells PM2 to restart your app
      run: |
        # This finds your app in the runner's temporary _work directory
        APP_PATH="/home/ubuntu/actions-runner/_work/LiveHorizon/LiveHorizon/backend/src/app.js"
        APP_CWD="/home/ubuntu/actions-runner/_work/LiveHorizon/LiveHorizon/backend"
        
        # This command uses the 'sudo' permission you set up in Phase 2
        # It restarts 'backend' OR starts it fresh if it's not running
        sudo pm2 restart backend || sudo pm2 start $APP_PATH --name backend --cwd $APP_CWD --user ubuntu
